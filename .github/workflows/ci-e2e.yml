name: End-to-End

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CORS_ORIGIN: http://127.0.0.1:3100
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/diffusion_e2e?schema=public
  E2E_API_BASE_URL: http://127.0.0.1:3101/api/v1
  E2E_BACKEND_PORT: 3101
  E2E_FRONTEND_PORT: 3100
  HUSKY: 0
  JWT_REFRESH_SECRET: ci-e2e-refresh-secret
  JWT_SECRET: ci-e2e-access-secret
  NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3101/api/v1
  RATE_LIMIT_MAX: 1000
  RATE_LIMIT_WINDOW_MS: 60000

jobs:
  e2e:
    name: Auth flow
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: diffusion_e2e
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d diffusion_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run auth E2E flow
        run: npm run test:e2e
